<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu carrinho · Flight with Musics</title>
<style>
:root{--bg:#0a0a0a;--card:#16140f;--head:#201c12;--cream:#f3efe6;--amber:#e8a93c;--mut:#b9b2a2;--line:#3a3326;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--cream);font-family:Montserrat,"Segoe UI",system-ui,sans-serif;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:16px;padding:12px 5%;border-bottom:1px solid #262219}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em}
.logo i{width:38px;height:38px;border:2px solid var(--amber);border-radius:50%;display:grid;place-items:center;font-style:normal;color:var(--amber)}
.logo small{display:block;color:var(--amber);font-size:.6rem;letter-spacing:.3em;font-weight:600}
nav{margin-left:auto;display:flex;gap:20px;font-size:.9rem}
nav a:hover{color:var(--amber)}
main{max-width:980px;margin:0 auto;padding:32px 5% 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
h1 span{color:var(--amber)}
.srch{display:flex;gap:8px;flex:1;max-width:420px}
.srch input{flex:1;background:var(--card);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit}
.btn,.b{display:block;width:100%;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#1d1a12;color:var(--cream);font-family:inherit;font-size:.88rem;cursor:pointer;text-align:center}
.btn:hover,.b:hover{border-color:var(--amber)}
.srch .btn{width:auto;background:var(--amber);color:#0a0a0a;font-weight:700;border-color:var(--amber)}
.btn.p{background:var(--amber);color:#0a0a0a;font-weight:700;border-color:var(--amber)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:22px 0 16px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--mut);font-family:inherit;font-size:.95rem;padding:8px 0;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--cream);font-weight:700;border-color:var(--amber)}
.cnt{margin-bottom:14px;color:var(--mut)}
.cnt b{color:var(--cream)}
select{background:var(--card);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit}
.oc{border:1px solid var(--line);border-radius:12px;margin-bottom:18px;background:var(--card);position:relative}
.oh{display:flex;gap:28px;flex-wrap:wrap;background:var(--head);padding:14px 18px;font-size:.88rem;border-radius:12px 12px 0 0;border-bottom:1px solid var(--line)}
.oh small{color:var(--mut);font-size:.7rem;letter-spacing:.05em}
.oh .r{margin-left:auto;text-align:right;position:relative}
.lk{color:var(--amber);cursor:pointer}
.lk:hover{text-decoration:underline}
.pop{display:none;position:absolute;right:0;top:100%;margin-top:6px;z-index:3;background:var(--card);border:1px solid var(--amber);border-radius:8px;padding:10px 16px;text-align:left;white-space:nowrap}
.pop.on{display:block}
.pop a{display:block;padding:3px 0}
.ob{display:grid;grid-template-columns:1fr 240px;gap:20px;padding:18px}
.ol h3{font-size:1.15rem;margin-bottom:2px}
.ol>small{color:var(--mut)}
.it{display:flex;gap:14px;margin-top:14px}
.th{flex:none;width:72px;height:80px;border-radius:8px;background:linear-gradient(135deg,#2a2112,#14110a);display:grid;place-items:center;color:var(--amber);font-size:1.5rem}
.inf small{color:var(--mut);display:block}
.inf .t{color:var(--amber);font-weight:600}
.pr{font-weight:700;margin:2px 0 6px}
.inf .b{width:auto;display:inline-block}
.or{display:flex;flex-direction:column;gap:10px}
.dt{border-top:1px solid var(--line);padding:14px 18px;font-size:.9rem;color:var(--mut)}
.dt div{display:flex;justify-content:space-between;padding:2px 0}
.empty{text-align:center;padding:36px 0;color:var(--mut)}
.empty .btn{display:inline-block;width:auto;margin-top:14px}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--amber);color:#0a0a0a;padding:10px 18px;border-radius:999px;font-weight:700;display:none;z-index:9}
@media(max-width:640px){.ob{grid-template-columns:1fr}.oh .r{margin-left:0;text-align:left}.pop{right:auto;left:0}}
@media print{body{background:#fff;color:#000}header,.top,.tabs,.or,.btn,.pop{display:none}.oc,.oh{background:#fff;border-color:#999}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><i>♪</i><span>FLIGHT<small>WITH MUSICS</small></span></a>
  <nav><a href="index.html">Início</a><a href="compras.html">Comprar</a><a href="login.html" id="lg">Login</a></nav>
</header>
<main>
  <div class="top">
    <h1>Meu <span>carrinho</span></h1>
    <div class="srch"><input id="q" placeholder="Buscar passeio, local ou piloto"><button class="btn" data-a="busca">Buscar</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="area"></div>
</main>
<div class="msg" id="msg"></div>

<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(n){return "R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2})}
function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cart=ld("fwm_cart",[]),orders=ld("fwm_orders",[]),user=ld("fwm_user",null),tab=location.hash==="#pedidos"?"ped":"cart",q="",days=183;
if(user)$("lg").textContent="Olá, "+user.nome;
function match(s){return !q||s.toLowerCase().indexOf(q)>-1}
function item(c,extra){return '<div class="it"><div class="th">✈</div><div class="inf"><span class="t">'+esc(c.t)+'</span><small>'+esc(c.l)+' · '+esc(c.p)+' · '+esc(c.a)+'</small><div class="pr">'+brl(c.v)+'</div>'+(extra||"")+'</div></div>'}
function tot(l){var t=0;l.forEach(function(c){t+=c.v});return t}
function empty(msg,btn){return '<div class="empty"><p>'+msg+'</p>'+(btn?'<a class="btn p" href="compras.html">Ver passeios</a>':'')+'</div>'}
function cartView(){
 if(!cart.length)return empty("Seu carrinho está vazio.",1);
 var rows="";
 cart.forEach(function(c,i){if(match(c.t+" "+c.l+" "+c.p))rows+=item(c,'<button class="b" data-a="rem" data-i="'+i+'">Remover</button>')});
 if(!rows)return empty("Não há itens com a palavra-chave pesquisada.");
 return '<p class="cnt"><b>'+cart.length+' itens</b> no carrinho</p><div class="oc"><div class="oh"><div><small>ITENS</small><br>'+cart.length+'</div><div><small>TOTAL</small><br>'+brl(tot(cart))+'</div><div class="r"><a class="lk" data-a="clr">Limpar carrinho</a></div></div><div class="ob"><div class="ol"><h3>Pronto para voar</h3><small>Revise os passeios antes de finalizar</small>'+rows+'</div><div class="or"><button class="btn p" data-a="fin">Finalizar compra</button><a class="btn" href="compras.html">Continuar comprando</a></div></div></div>';
}
function ordersView(st){
 var lim=Date.now()-days*864e5;
 var l=orders.filter(function(o){return o.st===st&&!o.hid&&o.d>=lim&&match(o.id+" "+o.items.map(function(c){return c.t+" "+c.l+" "+c.p}).join(" "))});
 var sel='<select id="dias"><option value="30"'+(days==30?' selected':'')+'>últimos 30 dias</option><option value="183"'+(days==183?' selected':'')+'>últimos 6 meses</option><option value="365"'+(days==365?' selected':'')+'>último ano</option><option value="3650"'+(days==3650?' selected':'')+'>todos</option></select>';
 var h='<p class="cnt"><b>'+l.length+' pedidos</b> realizados em '+sel+'</p>';
 if(!l.length)return h+empty(q?"Não há itens com a palavra-chave pesquisada.":(st==="ativo"?"Você ainda não tem pedidos.":"Nenhum pedido cancelado."),!q&&st==="ativo");
 l.forEach(function(o){
  var dt=new Date(o.d).toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"});
  var ativo=o.st==="ativo",its="";
  o.items.forEach(function(c,i){its+=item(c,'<button class="b" data-a="again" data-id="'+o.id+'" data-i="'+i+'">Comprar de novo</button>')});
  var dd="";o.items.forEach(function(c){dd+='<div><span>'+esc(c.t)+' ('+esc(c.a)+')</span><span>'+brl(c.v)+'</span></div>'});
  h+='<div class="oc"><div class="oh"><div><small>PEDIDO REALIZADO</small><br>'+dt+'</div><div><small>TOTAL</small><br>'+brl(o.tot)+'</div><div><small>PASSAGEIRO</small><br><span class="lk">'+esc(o.pax)+'</span></div><div class="r"><small>PEDIDO Nº '+o.id+'</small><br><a class="lk" data-a="det" data-id="'+o.id+'">Detalhes do pedido</a> | <a class="lk" data-a="rec" data-id="'+o.id+'">Recibo ▾</a><div class="pop" id="pop-'+o.id+'"><a class="lk" data-a="det" data-id="'+o.id+'">Recibo 1</a><a class="lk" data-a="print">Imprimir recibo</a></div></div></div>'
  +'<div class="ob"><div class="ol"><h3>'+(ativo?"Voo confirmado":"Pedido cancelado")+'</h3><small>'+(ativo?"Aguardando agendamento da data":"Este pedido não será realizado")+'</small>'+its+'</div><div class="or">'+(ativo?'<button class="btn" data-a="cancel" data-id="'+o.id+'">Cancelar pedido</button>':'')+'<button class="btn" data-a="hide" data-id="'+o.id+'">Ocultar pedido</button></div></div>'
  +'<div class="dt" id="dt-'+o.id+'" hidden>'+dd+'<div><b>Total</b><b>'+brl(o.tot)+'</b></div></div></div>';
 });
 return h;
}
function render(){
 var a=orders.filter(function(o){return o.st==="ativo"&&!o.hid}).length,c=orders.filter(function(o){return o.st==="cancelado"&&!o.hid}).length;
 $("tabs").innerHTML='<button data-a="tab" data-t="cart" class="'+(tab==="cart"?"on":"")+'">Carrinho ('+cart.length+')</button><button data-a="tab" data-t="ped" class="'+(tab==="ped"?"on":"")+'">Pedidos ('+a+')</button><button data-a="tab" data-t="can" class="'+(tab==="can"?"on":"")+'">Cancelados ('+c+')</button>';
 $("area").innerHTML=tab==="cart"?cartView():ordersView(tab==="ped"?"ativo":"cancelado");
}
function toast(t){var m=$("msg");m.textContent=t;m.style.display="block";setTimeout(function(){m.style.display="none"},1800)}
function find(id){return orders.filter(function(o){return o.id===id})[0]}
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;
 var a=el.dataset.a,id=el.dataset.id,i=+el.dataset.i,o=id?find(id):null;
 if(a==="tab"){tab=el.dataset.t}
 else if(a==="busca"){q=$("q").value.trim().toLowerCase()}
 else if(a==="rem"){cart.splice(i,1);sv("fwm_cart",cart)}
 else if(a==="clr"){cart=[];sv("fwm_cart",cart)}
 else if(a==="fin"){if(!cart.length)return;orders.unshift({id:"FWM-"+Math.floor(100000+Math.random()*900000),d:Date.now(),items:cart,tot:tot(cart),pax:user?user.nome:"Visitante",st:"ativo",hid:false});cart=[];sv("fwm_cart",cart);sv("fwm_orders",orders);tab="ped";toast("Compra finalizada! (protótipo, sem pagamento)")}
 else if(a==="again"){cart.push(o.items[i]);sv("fwm_cart",cart);toast("Adicionado ao carrinho");$("tabs").querySelector("button").textContent="Carrinho ("+cart.length+")";return}
 else if(a==="cancel"){o.st="cancelado";sv("fwm_orders",orders)}
 else if(a==="hide"){o.hid=true;sv("fwm_orders",orders)}
 else if(a==="det"){var d=$("dt-"+id);d.hidden=!d.hidden;var p=$("pop-"+id);if(p)p.classList.remove("on");return}
 else if(a==="rec"){$("pop-"+id).classList.toggle("on");return}
 else if(a==="print"){window.print();return}
 render();
});
$("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();render()});
document.addEventListener("change",function(e){if(e.target.id==="dias"){days=+e.target.value;render()}});
render();
</script>
</body>
</html>
